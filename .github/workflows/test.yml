name: Tests

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        include:
          - os: macos-latest
            python-version: "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          roots = (Path(".claude-plugin"), Path("evals"))
          files = [path for root in roots for path in root.rglob("*.json")]
          if not files:
              raise SystemExit("no JSON files found")
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(path)
          PY

      - name: Install shellcheck
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint the session hook
        if: runner.os == 'Linux'
        run: shellcheck scripts/session-context.sh
